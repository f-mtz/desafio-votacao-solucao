version: "3.9"
services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe
    ports:
      - "15210:1521"
    environment:
      - ORACLE_PASSWORD=StrongPwd123
      - APP_USER=VOTACAO_DB
      - APP_USER_PASSWORD=StrongPwd123
      # ORACLE_DATABASE padrão é XEPDB1; pode ser alterado com a var abaixo
      # - ORACLE_DATABASE=XEPDB1
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM dual;' | sqlplus -s system/$${ORACLE_PASSWORD}@localhost/XEPDB1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./api
    image: desafio-votacao-api:latest
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
      # Override das propriedades do Spring para usar o Oracle no Docker
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle:1521/XEPDB1
      - SPRING_DATASOURCE_USERNAME=VOTACAO_DB
      - SPRING_DATASOURCE_PASSWORD=StrongPwd123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.OracleDialect
    volumes:
      - h2-data:/app/data
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  k6:
    image: grafana/k6:0.50.0
    depends_on:
      api:
        condition: service_started
    environment:
      - BASE_URL=http://api:8080
    volumes:
      - ./api/perf/k6:/scripts
    entrypoint: ["/bin/sh", "-lc", "sleep 10 && k6 run /scripts/votar.js"]

volumes:
  h2-data:
    driver: local
  oracle-data:
    driver: local



