version: "3.9"
services:
  api:
    build:
      context: ./api
    image: desafio-votacao-api:latest
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
    volumes:
      - h2-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  k6:
    image: grafana/k6:0.50.0
    depends_on:
      api:
        condition: service_started
    environment:
      - BASE_URL=http://api:8080
    volumes:
      - ./api/perf/k6:/scripts
    entrypoint: ["/bin/sh", "-lc", "sleep 10 && k6 run /scripts/votar.js"]

volumes:
  h2-data:
    driver: local



